services:

  nginx:
    image: nginx:1.25-alpine
    container_name: gestion-produits-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-prod
      - php-dev
    networks:
      - gp-network
    restart: unless-stopped

  db-prod:
    image: mysql:8.0
    container_name: gestion-produits-db-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: gestion_produits
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/gestion_produits.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gestion-produits:latest
    container_name: gestion-produits-php-prod
    environment:
      DB_HOST: db-prod
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:-rootpassword}
      DB_NAME: gestion_produits
      DB_TYPE: mysql
    volumes:
      - uploads_prod:/var/www/html/uploads
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - gp-network
    restart: unless-stopped

  db-dev:
    image: postgres:15-alpine
    container_name: gestion-produits-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: gestion_produits
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/gestion_produits_pg.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  php-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gestion-produits:latest
    container_name: gestion-produits-php-dev
    environment:
      DB_HOST: db-dev
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-rootpassword}
      DB_NAME: gestion_produits
      DB_TYPE: pgsql
    volumes:
      - uploads_dev:/var/www/html/uploads
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - gp-network
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  uploads_prod:
  uploads_dev:

networks:
  gp-network:
    driver: bridge
