# Pour encoder : echo -n "valeur" | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: prod
type: Opaque
data:
  # "rootpassword" en base64
  db-password: cm9vdHBhc3N3b3Jk
  # "root" en base64
  db-user: cm9vdA==
  # "gestion_produits" en base64
  db-name: Z2VzdGlvbl9wcm9kdWl0cw==
