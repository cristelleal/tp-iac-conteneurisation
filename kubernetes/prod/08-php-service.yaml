# Service PHP — expose l'application PHP à l'intérieur du cluster
# L'Ingress (ci-dessous) envoie le trafic HTTP vers ce service
apiVersion: v1
kind: Service
metadata:
  name: php-service
  namespace: prod
spec:
  selector:
    app: php-app
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
